    <link rel="icon" href="./favicon.png" type="image/png" />
    <script>
      const coarsePointer = matchMedia('(pointer: coarse)').matches
      const shortScreenEdge = Math.min(screen.width, screen.height)
      const phone = coarsePointer && shortScreenEdge <= 500
      document.documentElement.dataset.mobilePerformance = String(coarsePointer && shortScreenEdge <= 600)
      let viewport
      let landscape
      let landscapeWidth = 1280
      let resizeTimer
      let keyboardBlurTimer
      let holdViewport = false
      let focusHeight = 0
      const visibleViewport = window.visualViewport
      const textEntry = (element) => element?.isContentEditable ||
        element?.matches('textarea, select, input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=button]):not([type=submit]):not([type=reset]):not([type=color])')
      const releaseViewport = () => {
        if (keyboardBlurTimer !== undefined) return
        keyboardBlurTimer = setTimeout(() => {
          keyboardBlurTimer = undefined
          if (!textEntry(document.activeElement)) {
            holdViewport = false
            fitDesktopViewport()
          }
        }, 650)
      }
      const fitDesktopViewport = () => {
        const nextLandscape = matchMedia('(orientation: landscape)').matches
        const zoom = innerWidth / (visibleViewport?.width || innerWidth)
        const visibleHeight = (visibleViewport?.height || innerHeight) * zoom
        const rotated = nextLandscape !== landscape
        if (rotated) {
          holdViewport = textEntry(document.activeElement)
          if (holdViewport) focusHeight = Math.max(innerHeight, visibleHeight)
        }
        if (holdViewport && !textEntry(document.activeElement)) {
          if (visibleHeight >= focusHeight * 0.85) {
            clearTimeout(keyboardBlurTimer)
            keyboardBlurTimer = undefined
            holdViewport = false
          } else releaseViewport()
        }
        if (phone) {
          if (nextLandscape && (!holdViewport || visibleHeight >= focusHeight * 0.65)) {
            document.documentElement.style.setProperty('--visible-viewport-height', `${visibleHeight}px`)
          }
          else if (!nextLandscape) document.documentElement.style.removeProperty('--visible-viewport-height')
        }
        const nextWidth = holdViewport && !rotated && viewport ? landscapeWidth :
          phone && nextLandscape ? Math.max(1280, Math.round(innerWidth / (holdViewport ? Math.max(innerHeight, visibleHeight) : visibleHeight) * 720)) : 1280
        if (viewport && nextLandscape === landscape && nextWidth === landscapeWidth) return
        landscapeWidth = nextWidth
        landscape = nextLandscape
        viewport?.remove()
        viewport = document.createElement('meta')
        viewport.name = 'viewport'
        viewport.content = phone && landscape
          ? `width=${landscapeWidth}`
          : 'width=device-width, initial-scale=1, viewport-fit=cover'
        document.head.append(viewport)
        if (phone && nextLandscape) requestAnimationFrame(() => {
          if (landscape && (!holdViewport || visibleHeight >= focusHeight * 0.65)) document.documentElement.style.setProperty('--visible-viewport-height',
            `${(visibleViewport?.height || innerHeight) * innerWidth / (visibleViewport?.width || innerWidth)}px`)
        })
      }
      const refreshViewport = () => {
        clearTimeout(resizeTimer)
        if (matchMedia('(orientation: landscape)').matches !== landscape) fitDesktopViewport()
        resizeTimer = setTimeout(fitDesktopViewport, 160)
      }
      fitDesktopViewport()
      if (phone) {
        addEventListener('focusin', (event) => {
          if (textEntry(event.target)) {
            clearTimeout(keyboardBlurTimer)
            keyboardBlurTimer = undefined
            if (!holdViewport) focusHeight = (visibleViewport?.height || innerHeight) * innerWidth / (visibleViewport?.width || innerWidth)
            holdViewport = true
          }
        }, true)
        addEventListener('focusout', () => {
          clearTimeout(keyboardBlurTimer)
          keyboardBlurTimer = undefined
          releaseViewport()
        }, true)
        addEventListener('resize', refreshViewport, { passive: true })
        addEventListener('load', refreshViewport, { once: true })
        visibleViewport?.addEventListener('resize', refreshViewport, { passive: true })
      }
    </script>
    <script>
      try {
        const profile = JSON.parse(localStorage.getItem('sts-profile') ?? 'null')
        if (typeof profile?.username === 'string' && profile.username.trim().length >= 2 &&
            typeof profile?.token === 'string' && /^[0-9a-f-]{36}$/.test(profile.token)) {
          for (const name of [
            'hit-burst', 'death-ash', 'death-ring',
            ...['awakened-blue-fire', 'awakened-claw-scratch', 'watcher-calm-aura', 'watcher-wrath-aura',
              'guard-bloom', 'hexaghost-flame-impact', 'hexaghost-flame', 'dark-channel', 'defect-face-orb',
              'frost-channel', 'ironclad-bash', 'ironclad-strike', 'lightning-channel', 'turn-lightning-strike',
              'magic-burst', 'potion-burst', 'silent-knife', 'silent-poison', 'silent-shiv', 'watcher-pray',
              'watcher-meteor-impact', 'watcher-meteor'].map((asset) => `actions/${asset}`),
          ]) {
            const link = document.createElement('link')
            link.rel = 'preload'
            link.as = 'image'
            link.type = 'image/webp'
            link.fetchPriority = 'low'
            link.href = `%BASE_URL%assets/combat/vfx/${name}.webp`
            link.dataset.combatVfx = ''
            document.head.append(link)
          }
        }
      } catch {}
    </script>
    <title>Slay the Spire — The Board Game</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
