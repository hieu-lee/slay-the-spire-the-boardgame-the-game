<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const coarsePointer = matchMedia('(pointer: coarse)').matches
      const shortScreenEdge = Math.min(screen.width, screen.height)
      const phone = coarsePointer && shortScreenEdge <= 500
      document.documentElement.dataset.mobilePerformance = String(coarsePointer && shortScreenEdge <= 600)
      if (document.documentElement.dataset.mobilePerformance !== 'true') {
        for (const asset of [
          'defect-charge.webp', 'defect-release.webp',
          'ironclad-ready.webp', 'ironclad-impact.webp', 'silent-throw.webp',
          'watcher-ready.webp', 'watcher-thrust.webp',
        ]) {
          const preload = document.createElement('link')
          preload.rel = 'preload'
          preload.as = 'image'
          preload.type = 'image/webp'
          preload.href = `/assets/combat/characters/${asset}`
          document.head.append(preload)
        }
      }
      let viewport
      let landscape
      let landscapeWidth = 1280
      const fitDesktopViewport = () => {
        const nextLandscape = matchMedia('(orientation: landscape)').matches
        if (viewport && nextLandscape === landscape) return
        if (phone && nextLandscape) {
          landscapeWidth = Math.max(1280, Math.round(innerWidth / innerHeight * 720))
        }
        landscape = nextLandscape
        viewport?.remove()
        viewport = document.createElement('meta')
        viewport.name = 'viewport'
        viewport.content = phone && landscape
          ? `width=${landscapeWidth}`
          : 'width=device-width, initial-scale=1, viewport-fit=cover'
        document.head.append(viewport)
      }
      fitDesktopViewport()
      if (phone) addEventListener('resize', fitDesktopViewport, { passive: true })
    </script>
