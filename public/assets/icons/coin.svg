      <stop offset="0.35" stop-color="#f6c548"/>
      <stop offset="0.75" stop-color="#c8761b"/>
      <stop offset="1" stop-color="#7c3a0b"/>
    </radialGradient>
    <radialGradient id="face" cx="40%" cy="32%" r="76%">
