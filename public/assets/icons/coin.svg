      <stop offset="0.5" stop-color="#eaa936"/>
      <stop offset="1" stop-color="#a65a16"/>
    </radialGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d2006"/>
      <stop offset="0.45" stop-color="#8a4512"/>
      <stop offset="1" stop-color="#3f1a05"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="72%" r="72%">
