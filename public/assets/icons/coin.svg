  <circle cx="32" cy="33.6" r="29" fill="#2a1405" opacity="0.5"/>
  <circle cx="32" cy="32" r="29" fill="url(#rim)" stroke="#3a1a05" stroke-width="2"/>
  <circle cx="32" cy="32" r="25.7" fill="none" stroke="#81450f" stroke-width="2.6" stroke-dasharray="1.4 2.2" opacity="0.8"/>
  <circle cx="32" cy="32" r="22.6" fill="#5e2c08"/>
  <circle cx="32" cy="32.7" r="21.5" fill="url(#face)"/>
  <path d="M19 47.2c4-2.2 8.4-3 13-3s9 .8 13 3l-1.6 2.6H20.6Z" fill="#6a300a"/>
