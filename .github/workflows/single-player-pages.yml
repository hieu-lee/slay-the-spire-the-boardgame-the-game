name: Deploy single-player game

on:
  push:
    branches:
      - master
      - hieu-lee/single-player-master
    paths:
      - .env
      - .github/workflows/single-player-pages.yml
      - index.html
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - public/**
      - scripts/check-single-player-build.mjs
      - scripts/verify-single-player-unlocks-browser.mjs
      - src/**
      - tsconfig.json
      - vite.config.ts
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: single-player-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hieu-lee/single-player-master
          fetch-depth: 0
      - name: Merge master while keeping branch config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git merge --no-commit --no-ff origin/master
          git restore --source=HEAD --staged --worktree -- \
            .env .github/workflows/single-player-pages.yml
          if git rev-parse --verify MERGE_HEAD >/dev/null 2>&1; then
            git commit --no-edit
          fi
          git push origin HEAD:refs/heads/hieu-lee/single-player-master
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:single-player-build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
