name: Audit multiplayer archive backup
run-name: Archive backup audit
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare encrypted backup with the live archive
        env:
          GH_TOKEN: ${{ github.token }}
          ROOM_STORE_KEY: ${{ secrets.ROOM_STORE_KEY }}
        run: |
          gh run download 34319525470 --repo "$GITHUB_REPOSITORY" --name room-store-34319525470 --dir "$RUNNER_TEMP/archive-backup"
          printf '%s' "$ROOM_STORE_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --output "$RUNNER_TEMP/archive-backup/rooms.json" --decrypt "$RUNNER_TEMP/archive-backup/rooms.json.gpg"
          node scripts/audit-archive-backup.mjs "$RUNNER_TEMP/archive-backup/rooms.json" "$RUNNER_TEMP/archive-audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-audit
          path: ${{ runner.temp }}/archive-audit.json
          retention-days: 1
