name: Deploy always-on multiplayer
run-name: ${{ inputs.refresh_only == true && 'Refresh multiplayer client' || inputs.source_run_id != '' && format('Multiplayer handoff from {0}', inputs.source_run_id) || 'Deploy always-on multiplayer' }}

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Legacy host run whose encrypted room state must be migrated
        required: false
      source_sha:
        description: Commit selected by the legacy handoff
        required: false
      source_wait_seconds:
        description: Maximum seconds to wait for the frozen legacy room store
        required: false
        default: '19200'
      refresh_only:
        description: Republish the client without restarting the room server
        required: false
        type: boolean
        default: false
      adopt_origin:
        description: Adopt a router-detected replacement stable origin
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: always-on-multiplayer
  cancel-in-progress: false

jobs:
  server:
    if: inputs.refresh_only != true
    runs-on: [self-hosted, linux, x64, sts-server]
    timeout-minutes: 360
    env:
      MULTIPLAYER_SERVER_ORIGIN: ${{ vars.MULTIPLAYER_SERVER_ORIGIN }}
      SESSION_SHA: ${{ inputs.source_sha || github.sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_WAIT_SECONDS: ${{ inputs.source_wait_seconds || '19200' }}
    steps:
      - name: Validate the stable server origin
        env:
          GH_TOKEN: ${{ github.token }}
          ROOM_STORE_KEY: ${{ secrets.ROOM_STORE_KEY }}
        run: |
          [[ "$MULTIPLAYER_SERVER_ORIGIN" =~ ^https://sts-([0-9]{1,3}-){3}[0-9]{1,3}\.([0-9a-f]{1,4}-){7}[0-9a-f]{1,4}\.sslip\.io:18443$ ]]
          if [ -n "$SOURCE_RUN_ID" ]; then
            test -n "$ROOM_STORE_KEY"
            case "$SOURCE_RUN_ID" in *[!0-9]*) exit 2;; esac
            advertised=$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --retry-delay 2 --max-time 30 \
              "https://hieu-lee.github.io/slay-the-spire-the-boardgame-the-game/session.json?source=$GITHUB_RUN_ID")
            advertised_run=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).runId ?? ""))' "$advertised")
            [ "$advertised_run" = "$SOURCE_RUN_ID" ]
            IFS=$'\t' read -r source_status source_branch source_path < <(
              timeout 30s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
                --jq '[.status, .head_branch, .path] | @tsv'
            )
            [ "$source_status" = in_progress ]
            [ "$source_branch" = master ]
            [ "$source_path" = .github/workflows/multiplayer-session.yml ]
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Prepare an immutable server release
        run: bash infra/deploy-local-server.sh prepare
      - name: Revalidate legacy ownership immediately before holding the API
        if: inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          advertised=$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 2 --max-time 30 \
            "https://hieu-lee.github.io/slay-the-spire-the-boardgame-the-game/session.json?hold=$GITHUB_RUN_ID")
          advertised_run=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).runId ?? ""))' "$advertised")
          advertised_always_on=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).alwaysOn === true))' "$advertised")
          [ "$advertised_run" = "$SOURCE_RUN_ID" ]
          [ "$advertised_always_on" = false ]
          IFS=$'\t' read -r source_status source_branch source_path < <(
            timeout 30s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
              --jq '[.status, .head_branch, .path] | @tsv'
          )
          [ "$source_status" = in_progress ]
          [ "$source_branch" = master ]
          [ "$source_path" = .github/workflows/multiplayer-session.yml ]
      - name: Hold the successor API until legacy state is restored
        if: inputs.source_run_id != ''
        run: |
          hold="$HOME/.local/share/slay-the-spire-server/migration-hold"
          hold_next="$hold.$GITHUB_RUN_ID.next"
          printf '%s %s\n' "$SOURCE_RUN_ID" "$(( $(date +%s) + 21600 ))" > "$hold_next"
          chmod 600 "$hold_next"
          mv -f "$hold_next" "$hold"
          systemctl --user stop sts-room-server.service
      - name: Announce the stable successor
        if: inputs.source_run_id != ''
        run: |
          printf '%s\n%s\n[%s]\n' "$MULTIPLAYER_SERVER_ORIGIN" "$SESSION_SHA" \
            "$(node -p 'JSON.stringify(process.argv[1])' "$MULTIPLAYER_SERVER_ORIGIN")" > "$RUNNER_TEMP/handoff-ready"
      - uses: actions/upload-artifact@v4
        if: inputs.source_run_id != ''
        with:
          name: handoff-candidate-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/handoff-ready
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: inputs.source_run_id != ''
        with:
          name: handoff-ready-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/handoff-ready
          retention-days: 1
      - name: Install, migrate, and verify the room server
        env:
          GH_TOKEN: ${{ github.token }}
          ROOM_STORE_KEY: ${{ secrets.ROOM_STORE_KEY }}
        run: bash infra/deploy-local-server.sh
      - name: Recover the persistent room service after an interrupted migration
        if: always() && inputs.source_run_id != ''
        run: bash infra/watchdog-wsl-host.sh

  client:
    needs: server
    if: always() && (needs.server.result == 'success' || needs.server.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MULTIPLAYER_SERVER_ORIGIN: ${{ vars.MULTIPLAYER_SERVER_ORIGIN }}
      PAGES_URL: https://hieu-lee.github.io/slay-the-spire-the-boardgame-the-game/
      SESSION_SHA: ${{ inputs.source_sha || github.sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      ADOPT_ORIGIN: ${{ inputs.adopt_origin }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: VITE_SINGLE_PLAYER=false VITE_HOSTED_SESSION=true pnpm build
      - run: node scripts/check-single-player-build.mjs dist --multiplayer
      - name: Prepare the stable client configuration
        run: |
          [[ "$MULTIPLAYER_SERVER_ORIGIN" =~ ^https://sts-([0-9]{1,3}-){3}[0-9]{1,3}\.([0-9a-f]{1,4}-){7}[0-9a-f]{1,4}\.sslip\.io:18443$ ]]
          cp -R dist pages
          current=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 \
            "$PAGES_URL/session.json?prepare=$GITHUB_RUN_ID")
          current_origin=$(jq -r '.origin // empty' <<< "$current")
          if [ -n "$SOURCE_RUN_ID" ] || [ "$ADOPT_ORIGIN" = true ] || [ "$current_origin" = "$MULTIPLAYER_SERVER_ORIGIN" ]; then
            curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 30 \
              "$MULTIPLAYER_SERVER_ORIGIN/api/health" | \
              jq -e '.protocolVersion == 1 and .profiles == true and .webSocketActionAcks == true' >/dev/null
            jq -n --arg origin "$MULTIPLAYER_SERVER_ORIGIN" --arg run "$GITHUB_RUN_ID" \
              --arg source "$SOURCE_RUN_ID" --arg sha "$SESSION_SHA" \
              '{origin:$origin,origins:[$origin],runId:$run,sourceRunId:$source,sha:$sha,protocolVersion:1,alwaysOn:true}' \
              > pages/session.json
          else
            jq --arg sha "$SESSION_SHA" '.sha = $sha | .protocolVersion = 1' <<< "$current" > pages/session.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pages-session-${{ github.run_id }}
          path: pages
          retention-days: 1
      - name: Queue the serialized Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          queued=false
          for attempt in {1..5}; do
            if timeout 30s gh workflow run pages-deploy.yml --repo "$GITHUB_REPOSITORY" --ref master \
                -f source_run_id="$GITHUB_RUN_ID" -f artifact_name="pages-session-$GITHUB_RUN_ID"; then
              queued=true
              break
            fi
            sleep 5
          done
          [ "$queued" = true ]
      - name: Keep the one-time successor visible to the legacy source
        if: inputs.source_run_id != ''
        run: |
          published=false
          for attempt in {1..90}; do
            config=$(curl --fail --silent --show-error --max-time 30 \
              "$PAGES_URL/session.json?successor=$GITHUB_RUN_ID-$attempt" || true)
            if jq -e --arg run "$GITHUB_RUN_ID" --arg source "$SOURCE_RUN_ID" \
                --arg origin "$MULTIPLAYER_SERVER_ORIGIN" \
                '.runId == $run and .sourceRunId == $source and .origin == $origin' <<< "$config" >/dev/null 2>&1; then
              published=true
              break
            fi
            sleep 10
          done
          [ "$published" = true ]
          # The immutable source polls once per minute and only accepts an
          # in-progress workflow. Stay observable across lagging Pages edges.
          sleep 300
