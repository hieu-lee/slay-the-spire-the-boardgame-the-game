name: Deploy GitHub Pages

on:
  workflow_call:
    inputs:
      deploy_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Commit to build after its server release is healthy (defaults to the selected ref)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MULTIPLAYER_SERVER_ORIGIN: ${{ vars.MULTIPLAYER_SERVER_ORIGIN }}
      DEPLOY_SHA: ${{ inputs.deploy_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Accept only commits merged to master
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/master
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: VITE_SINGLE_PLAYER=false VITE_HOSTED_SESSION=true pnpm build
      - run: node scripts/check-single-player-build.mjs dist --multiplayer
      - name: Prepare the stable multiplayer client
        run: |
          [[ "$MULTIPLAYER_SERVER_ORIGIN" =~ ^https://sts-([0-9]{1,3}-){3}[0-9]{1,3}\.([0-9a-f]{1,4}-){7}[0-9a-f]{1,4}\.sslip\.io:18443$ ]]
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 30 \
            "$MULTIPLAYER_SERVER_ORIGIN/api/health" | \
            jq -e --arg sha "$DEPLOY_SHA" \
              '.protocolVersion == 1 and .profiles == true and .webSocketActionAcks == true and .releaseSha == $sha' >/dev/null
          cp -R dist pages
          jq -n --arg origin "$MULTIPLAYER_SERVER_ORIGIN" --arg run "$GITHUB_RUN_ID" --arg sha "$DEPLOY_SHA" \
            '{origin:$origin,runId:$run,sha:$sha,protocolVersion:1,alwaysOn:true}' > pages/session.json
          node scripts/validate-session-config.mjs pages/session.json "$DEPLOY_SHA" "$MULTIPLAYER_SERVER_ORIGIN"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
