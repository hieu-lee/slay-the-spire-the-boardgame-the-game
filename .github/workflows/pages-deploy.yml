name: Deploy multiplayer Pages artifact
run-name: Deploy Pages from run ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run containing the prepared Pages artifact
        required: true
      artifact_name:
        description: Prepared Pages artifact name
        required: true

concurrency:
  group: multiplayer-pages-deployment
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MULTIPLAYER_SERVER_ORIGIN: ${{ vars.MULTIPLAYER_SERVER_ORIGIN }}
      PAGES_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      PAGES_URL: https://hieu-lee.github.io/slay-the-spire-the-boardgame-the-game/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and validate the prepared site
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          for attempt in 1 2; do
            download_dir="$RUNNER_TEMP/pages-$attempt"
            if timeout 300s gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --name "$ARTIFACT_NAME" --dir "$download_dir"; then
              mv "$download_dir" pages
              break
            fi
            sleep 10
          done
          test -f pages/session.json
          migration_source=$(node -e 'const c=require("./pages/session.json"); if(c.alwaysOn===true && c.sourceRunId) process.stdout.write(String(c.sourceRunId))')
          if [ -n "$migration_source" ]; then
            expected_sha=$(node -p 'require("./pages/session.json").sha')
          else
            expected_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          fi
          node scripts/validate-session-config.mjs pages/session.json "$expected_sha" "$MULTIPLAYER_SERVER_ORIGIN"
      - uses: actions/configure-pages@v5
      - name: Verify the room endpoint immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          healthy_origin=
          while IFS= read -r origin; do
            if curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
                "$origin/api/health" | jq -e '.protocolVersion == 1 and .profiles == true' >/dev/null; then
              healthy_origin=$origin
              break
            fi
          done < <(node -e 'const c=require("./pages/session.json"); console.log([...new Set([c.origin,...c.origins])].join("\n"))')
          test -n "$healthy_origin"
          migration_source=$(node -e 'const c=require("./pages/session.json"); if(c.alwaysOn===true && c.sourceRunId) process.stdout.write(String(c.sourceRunId))')
          if [ -n "$migration_source" ]; then
            case "$migration_source:$PAGES_SOURCE_RUN_ID" in *[!0-9:]*) exit 2;; esac
            producer_status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAGES_SOURCE_RUN_ID" --jq .status)
            producer_title=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAGES_SOURCE_RUN_ID" --jq .display_title)
            [ "$producer_status" = in_progress ]
            [ "$producer_title" = "Multiplayer handoff from $migration_source" ]
            [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$migration_source" --jq .status)" = in_progress ]
            advertised=$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 \
              "$PAGES_URL/session.json?lineage=$GITHUB_RUN_ID")
            advertised_run=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).runId ?? ""))' "$advertised")
            [ "$advertised_run" = "$migration_source" ] || [ "$advertised_run" = "$PAGES_SOURCE_RUN_ID" ]
            selection="$RUNNER_TEMP/pages-handoff-selection"
            timeout 60s gh run download "$migration_source" --repo "$GITHUB_REPOSITORY" \
              --name "handoff-selected-$migration_source" --dir "$selection"
            selected_run=$(sed -n '1p' "$selection/handoff-selected")
            selected_sha=$(sed -n '2p' "$selection/handoff-selected")
            if [ "$selected_run" != "$PAGES_SOURCE_RUN_ID" ]; then
              selected_state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$selected_run" \
                --jq '[.status, (.conclusion // "")] | join(" ")')
              [ "${selected_state%% *}" = completed ]
              case "${selected_state#* }" in failure|cancelled|timed_out|stale|action_required) ;; *) exit 1;; esac
            fi
            [ "$selected_sha" = "$(node -p 'require("./pages/session.json").sha')" ]
            expected_sha=$selected_sha
          else
            expected_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          fi
          node scripts/validate-session-config.mjs pages/session.json "$expected_sha" "$MULTIPLAYER_SERVER_ORIGIN" "$healthy_origin"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - name: Verify the migration producer remains live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          migration_source=$(node -e 'const c=require("./pages/session.json"); if(c.alwaysOn===true && c.sourceRunId) process.stdout.write(String(c.sourceRunId))')
          if [ -n "$migration_source" ]; then
            [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAGES_SOURCE_RUN_ID" --jq .status)" = in_progress ]
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
