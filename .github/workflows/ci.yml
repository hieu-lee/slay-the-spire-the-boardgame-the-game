name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Broad engine changes can select all three owning browser flows. Keep
    # enough headroom to run that lane serially instead of starving browsers.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Asset verification probes Ogg audio with ffprobe and batch-decodes the
      # committed PNG/WebP inventory with ffmpeg. Neither binary is guaranteed
      # on a fresh hosted runner, so install the package explicitly alongside
      # the Python and WebP tooling used by the pixel audits.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-numpy python3-pil webp
      # The browser matrix includes both engines. Installing only Chromium made
      # every WebKit-backed verifier fail after its Chromium assertions passed.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - name: Run checks affected by this push
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$PUSH_BASE
          if [ "$EVENT_NAME" = pull_request ]; then base=$PR_BASE; fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0+$ ]] ||
              ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          # Browser screenshot/performance suites compete for the same hosted
          # runner CPU. With the current matrix, two heavy children repeatedly
          # starve one another and turn valid UI into timeouts and frame spikes.
          node scripts/verify-all.mjs --changed="$base" --jobs=4 --heavy=1

  deploy-server:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/server-deploy.yml
    with:
      deploy_sha: ${{ github.sha }}

  deploy-pages:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: deploy-server
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-deploy.yml
    with:
      deploy_sha: ${{ github.sha }}
