name: Deploy multiplayer server

on:
  workflow_call:
    inputs:
      deploy_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Commit to deploy (defaults to the selected ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: multiplayer-server-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, sts-server]
    timeout-minutes: 30
    env:
      MULTIPLAYER_SERVER_ORIGIN: ${{ vars.MULTIPLAYER_SERVER_ORIGIN }}
      SESSION_SHA: ${{ inputs.deploy_sha || github.sha }}
    steps:
      - name: Validate the stable server origin
        run: |
          [[ "$MULTIPLAYER_SERVER_ORIGIN" =~ ^https://sts-([0-9]{1,3}-){3}[0-9]{1,3}\.([0-9a-f]{1,4}-){7}[0-9a-f]{1,4}\.sslip\.io:18443$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SESSION_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Accept only commits merged to master
        run: |
          [[ "$SESSION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SESSION_SHA"
          git fetch --no-tags origin master
          test "$(git rev-parse origin/master)" = "$SESSION_SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Prepare an immutable server release
        run: bash infra/deploy-local-server.sh prepare
      - name: Install and verify the room server
        run: bash infra/deploy-local-server.sh
